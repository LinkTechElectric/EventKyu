[workspace]

[package]
name = "eventkyu-win"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
description = "EventKyu Windows Tauri shell"

[lib]
name = "eventkyu_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cue-core = { path = "../../../core/cue-core" }
download-core = { path = "../../../core/download-core" }
runtime-manager = { path = "../../../core/runtime-manager" }
