name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: 共享核心（Rust workspace）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 全部单元测试
        run: cargo test --workspace

  macos-app:
    name: macOS 壳（UniFFI + Swift）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建核心并生成 Swift 绑定
        run: apps/eventkyu-mac/scripts/build-core.sh debug
      - name: Swift 构建
        run: swift build
        working-directory: apps/eventkyu-mac

  tauri-apps:
    name: Tauri 应用壳（eventkyu-win / signalfit）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [eventkyu-win, signalfit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev
      - name: Rust 检查与测试
        run: |
          cargo check
          cargo test
        working-directory: apps/${{ matrix.app }}/src-tauri
      - name: 前端构建
        run: |
          npm ci || npm install
          npm run build
        working-directory: apps/${{ matrix.app }}/ui
